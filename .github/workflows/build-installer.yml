name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ExteraMonitor.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version was not found in ExteraMonitor.csproj.' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer and portable ZIP
        shell: pwsh
        run: .\Packaging\Build-Release.ps1 -Version '${{ steps.version.outputs.value }}' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'extera-monitor-artifacts')

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ExteraMonitor-v${{ steps.version.outputs.value }}-windows-x64
          path: ${{ runner.temp }}\extera-monitor-artifacts\*
          if-no-files-found: error
          retention-days: 30
