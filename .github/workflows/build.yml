name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ExteraMonitor.csproj
      - run: dotnet build ExteraMonitor.csproj -c Release --no-restore
